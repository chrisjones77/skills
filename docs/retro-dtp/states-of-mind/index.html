<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>States of Mind · Print Shop design continuum</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3efe6;color:#231f1b;font:16px/1.45 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:clamp(12px,3vw,40px);display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,290px);gap:24px;align-items:start}img{width:100%;height:auto;display:block}h1{font:normal 2.4rem/1.08 Georgia,serif;margin:.25em 0 .5em}h2{font:600 1.12rem/1.25 system-ui;margin:1.15em 0 .3em}aside{position:sticky;top:1em}label{font-weight:600}input{width:100%;accent-color:#1e544c}button,a{font:inherit;color:inherit}button{background:white;border:1px solid #877f72;border-radius:3px;padding:6px 10px;margin:6px 0}a{display:block;margin:.6em 0}p{margin:.4em 0 1.1em}.status{font-size:.88em;color:#625d55}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #087cb0}@media(max-width:690px){main{grid-template-columns:1fr;gap:8px}aside{grid-row:1;position:static}h1{font-size:1.6rem}.status,p{margin-bottom:.5em}}</style></head><body><main><img id="cover" width="1254" height="1254" alt=""><aside><h1>States of Mind</h1><p class="status">The New Print Shop for DOS<br>Raster strength 0 · Clean output</p><label for="dial">Design strength <output id="num">0/8</output></label><input id="dial" type="range" min="0" max="8" value="0" step="1">
<div aria-live="polite"><h2 id="title"></h2><p id="caption"></p></div><button id="compare" aria-pressed="false">Compare with original</button><a id="full">Open full-size cover</a></aside></main>
<script>const frames=[{"file": "level-0.jpeg", "title": "Original cover", "description": "The original artwork preserves the full scene and prop lettering."}, {"file": "level-1.png", "title": "Subtitle reset", "description": "The album title moves onto a straight strip. The scene and wooden signs remain."}, {"file": "level-2.png", "title": "Two-line nameplate", "description": "Both titles move onto a flat nameplate above the dimensional scene."}, {"file": "level-3.png", "title": "Scene becomes an illustration", "description": "The bridge and river become spot art. Individual signs still carry the names."}, {"file": "level-4.png", "title": "Illustration and list in columns", "description": "The bridge and banjo sit beside a separate list of states."}, {"file": "level-5.png", "title": "Vignette above the list", "description": "The motifs share one horizontal illustration above the list."}, {"file": "level-6.png", "title": "Two independent stamps", "description": "Bridge and banjo stand alone on paper. The names form one column."}, {"file": "level-7.png", "title": "One stamp and a repeat", "description": "The bridge is the sole picture. A repeated unit organizes the names."}, {"file": "level-8.png", "title": "One stamp inside a full border", "description": "A bridge stamp, two title lines, seven centred names and one border unit make the page."}];const get=id=>document.getElementById(id);let compare=false;
function show(){const i=compare?0:Number(get('dial').value),f=frames[i];get('num').textContent=i+'/8';get('title').textContent=f.title;get('caption').textContent=f.description;get('cover').src=f.file;get('cover').alt='Level '+i+'. '+f.description;get('full').href=f.file;get('compare').textContent=compare?'Back to selected level':'Compare with original';get('compare').disabled=!compare&&i===0;get('compare').setAttribute('aria-pressed',String(compare))}
get('dial').addEventListener('input',()=>{compare=false;show()});get('compare').addEventListener('click',()=>{compare=!compare;show()});show();</script></body></html>
