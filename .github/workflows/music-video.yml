name: Music video renderer

on:
  pull_request:
    paths:
      - 'build-music-video/**'
      - '.github/workflows/music-video.yml'
  push:
    branches: [main]
    paths:
      - 'build-music-video/**'
      - '.github/workflows/music-video.yml'

permissions:
  contents: read

jobs:
  render-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s build-music-video/scripts -p 'test_*.py' -v
