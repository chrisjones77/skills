name: Unified work harness

on:
  pull_request:
    paths: &paths
      - "unified-work-harness/**"
      - "scripts/test_convergence*"
      - "scripts/test_storyboard*"
      - "scripts/validate_storyboards.py"
      - "docs/skill-storyboards/**"
      - "image-card-coverage-harness/scripts/harness.py"
      - ".github/workflows/unified-work-harness.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, fs: sensitive}
          - {os: macos-latest, fs: insensitive}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node scripts/test_convergence.mjs suite > "$RUNNER_TEMP/convergence.json"
        env:
          UWH_EXPECT_FS: ${{ matrix.fs }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: convergence-${{ matrix.os }}
          path: ${{ runner.temp }}/convergence.json
      - name: Use the coverage baseline Node version
        if: matrix.os == 'macos-latest'
        uses: actions/setup-node@v4
        with: {node-version: '22.23.4'}
      - name: Measure deterministic runtime coverage
        if: matrix.os == 'macos-latest'
        run: |
          node --experimental-test-coverage --test-coverage-include='unified-work-harness/*.mjs' \
            --test-coverage-exclude='**/*.test.mjs' --test-coverage-exclude='**/test-support.mjs' \
            --test --test-concurrency=4 --test-reporter=tap unified-work-harness/*.test.mjs > "$RUNNER_TEMP/coverage.tap"
          sed -n '/^# start of coverage report/,$p' "$RUNNER_TEMP/coverage.tap" | cut -d '|' -f 1-4 | tee "$RUNNER_TEMP/coverage-summary.txt"
          { echo '### Deterministic runtime coverage'; echo '~~~'; cat "$RUNNER_TEMP/coverage-summary.txt"; echo '~~~'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'macos-latest'
        with:
          name: runtime-coverage-macos
          path: ${{ runner.temp }}/coverage.tap
  installed-worker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            fs: sensitive
            asset: opencode-linux-x64-baseline.tar.gz
            digest: ccd10586611b598b1eaed7c05cfbcbc68e3ec09e736b360da09b1d615d922968
          - os: macos-latest
            fs: insensitive
            asset: opencode-darwin-arm64.zip
            digest: 606b09722d98069605e16037fb8c3c7c8ebbfed9ba713079a5efb2e5b065ae27
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install the verified worker
        working-directory: ${{ runner.temp }}
        env:
          ASSET: ${{ matrix.asset }}
          DIGEST: ${{ matrix.digest }}
        run: |
          curl --fail --location --retry 2 -O "https://github.com/anomalyco/opencode/releases/download/v1.18.25/$ASSET"
          echo "$DIGEST  $ASSET" | shasum -a 256 -c
          mkdir worker
          case "$ASSET" in
            *.zip) unzip -q "$ASSET" -d worker ;;
            *.tar.gz) tar xzf "$ASSET" -C worker ;;
          esac
          binary=$(find "$RUNNER_TEMP/worker" -type f -name opencode -print)
          test -x "$binary"
          dirname "$binary" >> "$GITHUB_PATH"
      - run: node scripts/test_convergence.mjs worker > "$RUNNER_TEMP/worker.json"
        env: {UWH_WORKER_VERSION: "1.18.25", UWH_EXPECT_FS: "${{ matrix.fs }}"}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "convergence-worker-${{ matrix.os }}", path: "${{ runner.temp }}/worker.json"}
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: python3 scripts/test_convergence_mutations.py
